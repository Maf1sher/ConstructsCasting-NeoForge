plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        name "CurseMaven"
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name "Iron's Maven - Release"
        url "https://code.redspace.io/releases"
    }
    maven { // JEI
        name "BlameJared Maven"
        url "https://maven.blamejared.com"
    }
    // Local Mantle-NeoForge build
    flatDir {
        dir '../../Tinkers-1.21.1-NeoForge/Mantle-NeoForge/build/libs'
    }
    // Local TCon-NeoForge build
    flatDir {
        dir '../../Tinkers-1.21.1-NeoForge/TinkersConstruct-NeoForge/build/libs'
    }
}

dependencies {
    // TCon + Mantle (local builds)
    implementation fileTree(dir: '../../Tinkers-1.21.1-NeoForge/Mantle-NeoForge/build/libs', include: 'Mantle-*.jar')
    implementation fileTree(dir: '../../Tinkers-1.21.1-NeoForge/TinkersConstruct-NeoForge/build/libs', include: 'TinkersConstruct-*.jar')

    // ISS API (compileOnly)
    compileOnly "io.redspace:irons_spellbooks:${irons_spells_version}:api"
    // ISS full mod (localRuntime)
    localRuntime "io.redspace:irons_spellbooks:${irons_spells_version}"
    localRuntime "io.redspace:irons_lib:${irons_lib_version}"

    // GeckoLib
    implementation "curse.maven:geckolib-388172:7707149"

    // Curios
    implementation "curse.maven:curios-309927:6529130"

    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Player Animator
    localRuntime "curse.maven:playeranimator-658587:7389814"

    // Optional integrations (compileOnly)
    compileOnly "curse.maven:cataclysm-spellbooks-1099461:7703231"
    compileOnly "curse.maven:alshanexs-familiars-1171602:8059472"
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArguments.add('--nogui')
        }
        data {
            data()
            programArguments.addAll('--mod', 'constructs_casting', '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath(),
                '--existing-mod', 'tconstruct',
                '--existing-mod', 'irons_spellbooks')
        }
    }

    mods {
        constructs_casting {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version, neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
